name: "Causal Verify"
description: "Metered verification gate for generated Python. POSTs source + tests to /v1/verify and fails CI unless the gate passes."
author: "zensteagarden"
branding:
  icon: shield
  color: blue
inputs:
  api-key:
    description: "cek_ API key from POST /v1/accounts/signup or /v1/accounts/register. Store as a GitHub secret."
    required: true
  gateway-url:
    description: "Causal verification gateway base URL."
    required: false
    default: "https://causal-engine-gateway.fly.dev"
  source-path:
    description: "Python file to verify. If omitted on a pull_request, the first added/modified .py file vs github.base_ref is used."
    required: false
    default: ""
  test-path:
    description: "Pytest file defining the verification contract."
    required: true
  require-signed-receipt:
    description: "Require a valid DSSE/Ed25519 receipt bound to the submitted source and tests."
    required: false
    default: "true"
  timeout-seconds:
    description: "Client-side timeout for the verification request. Must be 5-600 seconds."
    required: false
    default: "120"
outputs:
  passed:
    description: "true when verification passed, otherwise false"
  status:
    description: "pass/fail style status, SETTLED/FAILED legacy status, PAYMENT_REQUIRED, or HTTP_ERROR"
  cycle-status:
    description: "Backward-compatible alias for status"
  endpoint-id:
    description: "Endpoint id or content hash when returned by the engine"
  checkout-url:
    description: "Stripe Checkout URL when the engine returns HTTP 402"
  credits-remaining:
    description: "Credits remaining when returned by the engine"
  request-id:
    description: "Request id when returned by the engine"
  http-status:
    description: "HTTP status from POST /v1/verify"
  ast-valid:
    description: "AST validity signal when returned by the engine"
  error-type:
    description: "Machine-readable error type when returned by the engine"
  receipt-id:
    description: "Content-addressed verification receipt ID"
  receipt-url:
    description: "Permanent receipt lookup URL"
  receipt-authentication:
    description: "Receipt authentication mode; DSSE_ED25519 when trusted"
runs:
  using: node24
  main: index.js
